<mat-sidenav-container class="container">
  <mat-sidenav
    #sidenav
    [mode]="narrow() ? 'over' : 'side'"
    [opened]="!narrow()"
    class="sidenav"
    [attr.aria-label]="'nav.label' | translate"
  >
    <div class="brand">
      <mat-icon aria-hidden="true">nights_stay</mat-icon>
      <span>{{ 'app.name' | translate }}</span>
    </div>
    <mat-nav-list>
      @for (item of nav(); track item.link) {
        <a
          mat-list-item
          [routerLink]="item.link"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: false }"
          (click)="narrow() && sidenav.close()"
        >
          <mat-icon matListItemIcon aria-hidden="true">{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.labelKey | translate }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="toolbar">
      @if (narrow()) {
        <button
          mat-icon-button
          type="button"
          [attr.aria-label]="'nav.menu' | translate"
          (click)="sidenav.toggle()"
        >
          <mat-icon>menu</mat-icon>
        </button>
      }
      <span class="spacer"></span>
      <app-language-toggle />
      <button mat-button type="button" class="user-button" [matMenuTriggerFor]="userMenu">
        <mat-icon>account_circle</mat-icon>
        <span class="user-name">{{ auth.user()?.fullName || auth.user()?.phone }}</span>
        <mat-icon>arrow_drop_down</mat-icon>
      </button>
      <mat-menu #userMenu="matMenu">
        <div class="menu-head">
          <strong>{{ auth.user()?.fullName }}</strong>
          <span class="muted">{{ 'roles.' + auth.role() | translate }}</span>
        </div>
        <a mat-menu-item routerLink="/account">
          <mat-icon>settings</mat-icon>
          <span>{{ 'nav.account' | translate }}</span>
        </a>
        <button mat-menu-item type="button" (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>{{ 'nav.logout' | translate }}</span>
        </button>
      </mat-menu>
    </mat-toolbar>
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>
